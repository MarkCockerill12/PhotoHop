name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Create the release first, so each build uploads its own files straight to it (no hand-off of
  # the 150 MB Windows zip between jobs).
  create:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  build:
    needs: create
    if: always() && (needs.create.result == 'success' || needs.create.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Build
        run: cargo build --release --locked -p photohop
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          d="PhotoHop-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir "$d"
          cp target/release/photohop README.md LICENSE "$d/"
          target/release/photohop --manual "$d/PhotoHop-Manual.html"
          cp -r ai "$d/ai"
          tar czf "$d.tar.gz" "$d"
      - name: Package (Windows, with FFmpeg)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $d = "PhotoHop-$env:GITHUB_REF_NAME-${{ matrix.name }}"
          New-Item -ItemType Directory $d | Out-Null
          Copy-Item target/release/photohop.exe, README.md, LICENSE $d
          Start-Process -Wait -FilePath target/release/photohop.exe -ArgumentList '--manual', "$d/PhotoHop-Manual.html"
          if (-not (Test-Path "$d/PhotoHop-Manual.html")) { Copy-Item docs/PhotoHop-Manual.html $d }
          Copy-Item -Recurse ai "$d/ai"
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ff.zip
          Expand-Archive ff.zip ff
          $bin = Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $bin.FullName, (Join-Path $bin.DirectoryName ffprobe.exe) $d
          $lic = Get-ChildItem ff -Recurse -Filter LICENSE.txt | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName "$d/FFMPEG-LICENSE.txt" }
          Compress-Archive -Path $d -DestinationPath "$d.zip"
      - name: Package Blender add-on
        if: runner.os == 'Linux'
        run: cd blender_addon && zip -r ../photohop_bridge.zip photohop_bridge
      - name: Upload to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PhotoHop-*.tar.gz
            PhotoHop-*.zip
            photohop_bridge.zip
          fail_on_unmatched_files: false
      - name: Keep the build (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            PhotoHop-*.tar.gz
            PhotoHop-*.zip
